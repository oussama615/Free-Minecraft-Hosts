name: Build StrawIO VoiceChat Android APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend API URL baked into the debug APK"
        required: false
        default: "http://100.115.92.195:3000"
  push:
    branches: ["main", "rebuild/strawio-voicechat-app"]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Prepare Android project
        working-directory: mobile
        run: |
          flutter create --platforms=android --org com.strawio --project-name strawio_voicechat .
          flutter pub get

      - name: Flutter analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Flutter test
        working-directory: mobile
        run: flutter test

      - name: Build debug APK for local backend
        working-directory: mobile
        env:
          API_BASE_URL: ${{ github.event.inputs.api_base_url || 'http://100.115.92.195:3000' }}
        run: flutter build apk --debug --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: StrawIO-VoiceChat-local-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
