name: Build EMP Control Android APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend API URL baked into the APK"
        required: false
        default: "http://10.0.2.2:3000"

  push:
    branches: ["main"]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ github.event.inputs.api_base_url || 'http://10.0.2.2:3000' }}

      - name: Copy APK to dist
        run: |
          mkdir -p dist
          cp mobile/build/app/outputs/flutter-apk/app-release.apk dist/EMP-Control.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EMP-Control.apk
          path: dist/EMP-Control.apk
          if-no-files-found: error