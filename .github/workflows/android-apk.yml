name: Build StrawIO VoiceChat Android APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend API URL baked into the APK"
        required: false
        default: "http://10.0.2.2:3000"

  push:
    branches: ["main"]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: "stable"
          cache: true

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"

      - name: Flutter version
        working-directory: mobile
        run: flutter --version

      - name: Flutter pub get
        working-directory: mobile
        run: flutter pub get

      - name: Flutter analyze
        working-directory: mobile
        run: flutter analyze

      - name: Flutter test
        working-directory: mobile
        run: flutter test

      - name: Build release APK
        working-directory: mobile
        env:
          API_BASE_URL: ${{ github.event.inputs.api_base_url || 'http://10.0.2.2:3000' }}
        run: flutter build apk --release --dart-define=API_BASE_URL=$API_BASE_URL

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: StrawIO-VoiceChat-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
