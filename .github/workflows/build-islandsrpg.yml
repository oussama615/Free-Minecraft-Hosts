name: Build IslandsRPG

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build IslandsRPG
        run: mvn -U clean package

      - name: Upload IslandsRPG artifact
        uses: actions/upload-artifact@v4
        with:
          name: IslandsRPG-1.0.0
          path: |
            target/IslandsRPG-1.0.0.jar
            target/*.jar
          if-no-files-found: error
