plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.empcontrol'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.20.6-R0.1-SNAPSHOT'
    implementation 'org.java-websocket:Java-WebSocket:1.5.6'
    implementation 'com.google.code.gson:gson:2.11.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

shadowJar {
    archiveBaseName.set('EMPControlAgent')
    archiveClassifier.set('')
    relocate 'org.java_websocket', 'com.empcontrol.agent.libs.websocket'
    relocate 'com.google.gson', 'com.empcontrol.agent.libs.gson'
}

tasks.register('copyPluginJar', Copy) {
    dependsOn shadowJar
    from shadowJar.archiveFile
    into rootProject.layout.projectDirectory.dir('../dist')
    rename { 'EMPControlAgent.jar' }
}

build {
    dependsOn shadowJar
    finalizedBy copyPluginJar
}
